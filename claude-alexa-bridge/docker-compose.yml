version: '3.8'

services:
  claude-alexa-bridge:
    build: .
    container_name: claude-alexa-bridge
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=3000
      - HOST=0.0.0.0
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    networks:
      - bridge-network

  # Optional: mitmproxy for HTTPS interception
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: mitmproxy-bridge
    ports:
      - "8080:8080"
      - "8081:8081"
    entrypoint: >
      mitmproxy
      --mode reverse:http://claude-alexa-bridge:3000@8080
      --listen-host 0.0.0.0
      --listen-port 8080
    depends_on:
      - claude-alexa-bridge
    networks:
      - bridge-network
    restart: unless-stopped

networks:
  bridge-network:
    driver: bridge
